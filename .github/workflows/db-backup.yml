name: DB backup (off-Railway)

# Respaldo de la BD de producción FUERA de Railway: el cómputo corre en GitHub y
# la copia se sube a un bucket S3-compatible (R2 recomendado). Ninguno de los dos
# es Railway → sobrevive a un compromiso de la cuenta de Railway (riesgo R-17).
# Cada corrida además DESCARGA el objeto recién subido y lo RESTAURA en un Postgres
# efímero: verifica que la copia del storage realmente restaura, no solo que subió.
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   DATABASE_PUBLIC_URL          URL pública del Postgres de Railway (DATABASE_PUBLIC_URL)
#   BACKUP_S3_ENDPOINT           p. ej. https://<accountid>.r2.cloudflarestorage.com
#   BACKUP_S3_BUCKET             nombre del bucket
#   BACKUP_S3_ACCESS_KEY_ID      access key del bucket
#   BACKUP_S3_SECRET_ACCESS_KEY  secret key del bucket
# Variables opcionales (Settings → Variables):
#   BACKUP_S3_REGION             default: auto  (R2 usa "auto")
#   BACKUP_RETENTION_DAYS        default: 14

on:
  schedule:
    - cron: "17 */6 * * *" # cada 6 h (minuto 17 para evitar el pico en punto)
  workflow_dispatch: {} # permite lanzarlo a mano para probar

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      PGBIN: /usr/lib/postgresql/18/bin
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
      AWS_EC2_METADATA_DISABLED: "true"
      ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '14' }}
    services:
      # pgvector/pgvector:pg18 trae la extensión `vector` que usa el esquema (RAG);
      # un postgres:18 pelado fallaría al restaurar la columna `embedding`.
      verifier:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Preflight — secrets configurados
        id: pre
        run: |
          if [ -z "${{ secrets.DATABASE_PUBLIC_URL }}" ] || [ -z "$ENDPOINT" ] || [ -z "$BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::notice::Secrets de backup no configurados todavía; se omite. Ver .github/workflows/db-backup.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar cliente PostgreSQL 18
        if: steps.pre.outputs.ready == 'true'
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18

      - name: Dump de producción (-Fc)
        if: steps.pre.outputs.ready == 'true'
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          FILE="pgdump-prod-${TS}.dump"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          "$PGBIN/pg_dump" "$DATABASE_PUBLIC_URL" -Fc -f "$FILE"
          ls -lh "$FILE"

      - name: Subir al bucket (fuera de Railway)
        if: steps.pre.outputs.ready == 'true'
        run: |
          aws --endpoint-url "$ENDPOINT" s3 cp "$FILE" "s3://$BUCKET/db/$FILE" --only-show-errors
          echo "Subido s3://$BUCKET/db/$FILE"

      - name: Verificar restore DESDE el storage
        if: steps.pre.outputs.ready == 'true'
        env:
          PGPASSWORD: verify
        run: |
          # Descarga el objeto recién subido (no reusa el archivo local) y lo restaura
          # en el Postgres efímero: prueba la copia del bucket de punta a punta.
          aws --endpoint-url "$ENDPOINT" s3 cp "s3://$BUCKET/db/$FILE" "verify-$FILE" --only-show-errors
          # El esquema referencia el rol conversia_app (GRANTs/RLS); créalo antes.
          "$PGBIN/psql" -h localhost -U postgres -d verify -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='conversia_app') THEN CREATE ROLE conversia_app LOGIN PASSWORD 'x'; END IF; END \$\$;"
          # --no-owner: los objetos quedan del rol postgres. Errores de GRANT no abortan.
          "$PGBIN/pg_restore" -h localhost -U postgres -d verify --no-owner "verify-$FILE" || true
          TABLES=$("$PGBIN/psql" -h localhost -U postgres -d verify -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          POLICIES=$("$PGBIN/psql" -h localhost -U postgres -d verify -tAc "SELECT count(*) FROM pg_policies;")
          ORGS=$("$PGBIN/psql" -h localhost -U postgres -d verify -tAc "SELECT count(*) FROM organizations;")
          echo "Restaurado desde storage → tablas=$TABLES políticas_RLS=$POLICIES organizations=$ORGS"
          if [ "${TABLES:-0}" -lt 20 ]; then
            echo "::error::La copia del storage no restauró un esquema válido (tablas=$TABLES)"; exit 1
          fi
          if [ "${POLICIES:-0}" -lt 1 ]; then
            echo "::error::Restore sin políticas RLS (posible dump incompleto)"; exit 1
          fi

      - name: Retención — borrar copias antiguas del bucket
        if: steps.pre.outputs.ready == 'true'
        run: |
          CUTOFF=$(date -u -d "-${RETENTION_DAYS} days" +%s)
          aws --endpoint-url "$ENDPOINT" s3api list-objects-v2 --bucket "$BUCKET" --prefix "db/" \
            --query 'Contents[].{K:Key,D:LastModified}' --output json > objs.json || echo "[]" > objs.json
          python3 - "$CUTOFF" <<'PY'
          import json, subprocess, sys, datetime, os
          cutoff = int(sys.argv[1])
          endpoint = os.environ["ENDPOINT"]; bucket = os.environ["BUCKET"]
          try:
              objs = json.load(open("objs.json")) or []
          except Exception:
              objs = []
          removed = 0
          for o in objs:
              d = o.get("D"); k = o.get("K")
              if not d or not k:
                  continue
              ts = datetime.datetime.fromisoformat(d.replace("Z", "+00:00")).timestamp()
              if ts < cutoff:
                  subprocess.run(["aws", "--endpoint-url", endpoint, "s3", "rm",
                                  f"s3://{bucket}/{k}", "--only-show-errors"], check=False)
                  removed += 1
          print(f"Retención: {removed} copia(s) > {os.environ['RETENTION_DAYS']} días eliminadas")
          PY

      - name: Resumen
        if: steps.pre.outputs.ready == 'true'
        run: echo "✅ Backup + verificación de restore desde storage OK — $FILE" >> "$GITHUB_STEP_SUMMARY"
