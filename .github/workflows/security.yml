name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # semanal, lunes 06:00 UTC

# Mínimo privilegio para el token de Actions
permissions:
  contents: read
  # gitleaks-action lista los commits del PR vía API en eventos pull_request
  pull-requests: read

jobs:
  # --- Escaneo de secretos (BLOQUEANTE) ---
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Dependencias vulnerables (informativo; no bloquea por transitivas) ---
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sin `version`: la toma del campo packageManager de package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level high || true

  # --- SAST con CodeQL ---
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # requerido por codeql-action para leer metadatos del run en repos privados
      actions: read
    strategy:
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  # --- SBOM (CycloneDX) publicado como artefacto ---
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sin `version`: la toma del campo packageManager de package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generar SBOM CycloneDX
        run: npx -y @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.json || npx -y @cyclonedx/cyclonedx-npm --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # --- Aislamiento multi-tenant: prueba de RLS con rol de app (BLOQUEANTE) ---
  # Levanta Postgres, aplica migraciones + RLS y corre el verificador con el
  # rol conversia_app (sin BYPASSRLS). Falla el pipeline si el aislamiento se rompe.
  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conversia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conversia_ci
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conversia_ci
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conversia_ci
      APP_DATABASE_URL: postgresql://conversia_app:conversia_app_dev_password@localhost:5432/conversia_ci
      SEED_ADMIN_PASSWORD: ci-verificacion-1234
    steps:
      - uses: actions/checkout@v4
      # Sin `version`: la toma del campo packageManager de package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @conversia/database db:generate
      - run: pnpm --filter @conversia/database db:deploy
      - run: pnpm --filter @conversia/database db:setup
      - run: pnpm --filter @conversia/database db:seed
      - name: Verificar aislamiento (rol conversia_app, sin BYPASSRLS)
        run: pnpm --filter @conversia/database verify:isolation
