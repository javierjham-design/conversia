name: deploy-conversia-web

# Autodeploy de conversia-web (Bloque 2 de PROMPT_DEPLOY_CONVERSIA_WEB). La API y el worker se
# autodespliegan por la integración GitHub de Railway; conversia-web no estaba conectado y quedaba
# atrás en cada merge (quedó en el deploy del 23-oct mientras #533 ya estaba en main y en la API).
# Este workflow publica la web en cada push a main que toque su código o los paquetes compartidos.
#
# Requisito de UNA sola vez del dueño: crear el secret RAILWAY_TOKEN del repo (token de PROYECTO de
# Railway del proyecto conversia). Nunca se escribe el token en el código. Alternativa equivalente:
# conectar el servicio a GitHub en el dashboard de Railway (como api/worker) y borrar este workflow.
#
# SIN EL TOKEN, ESTE JOB FALLA A PROPÓSITO (28-oct-2026). Antes se saltaba el deploy con un aviso y
# terminaba en verde: un workflow llamado "deploy" que informa éxito sin desplegar nada. El 28-oct
# producción servía un commit de la mañana con TRECE commits ya en main —entre ellos arreglos de
# cobro— y no había una sola señal roja en ninguna parte. Un rojo por merge es molesto; creer que
# algo se desplegó cuando no, cuesta mucho más. No bloquea nada: corre DESPUÉS del merge y no es
# un check requerido.
#
# Y DESPUÉS DE DESPLEGAR, SE COMPRUEBA (28-oct-2026, misma tarde). Con el token ya puesto, el
# builder de Railway falló tras 24 minutos ("Failed to build an image") con un commit que compila
# sin problemas —el mismo Dockerfile y el mismo commit construyen en 62s en local— y un `railway
# up` idéntico, repetido 20 minutos después, funcionó. O sea: el deploy puede caerse por razones
# que no están en el código. Por eso ahora se reintenta una vez, y al final se lee
# /version.json desde fuera: que el comando devuelva 0 no es prueba de que la web nueva esté
# arriba; que producción sirva este SHA, sí.

on:
  push:
    branches: [main]
    paths:
      - "apps/conversia-web/**"
      - "packages/**"
      - ".github/workflows/deploy-conversia-web.yml"
  workflow_dispatch: {}

# Evita despliegues solapados: si entran dos pushes, el último manda.
concurrency:
  group: deploy-conversia-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Sello de versión: escribe public/version.json con el SHA de este commit ANTES de subir el
      # árbol a Railway, para que https://app.conversia.cl/version.json lo exponga.
      - name: Sellar versión
        run: node apps/conversia-web/scripts/stamp-version.mjs
      - name: Publicar en Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error title=conversia-web NO se desplegó::Falta el secret RAILWAY_TOKEN, así que este commit NO está en producción."
            echo ""
            echo "Dos formas de arreglarlo, cualquiera sirve:"
            echo "  1) Settings → Secrets and variables → Actions → nuevo secret RAILWAY_TOKEN"
            echo "     (token de PROYECTO de Railway del proyecto conversia)."
            echo "  2) Conectar el servicio conversia-web a GitHub en el dashboard de Railway"
            echo "     (como api y worker) y BORRAR este workflow."
            echo ""
            echo "Mientras tanto hay que desplegar a mano:"
            echo "  railway up --service conversia-web --ci"
            exit 1
          fi
          npm i -g @railway/cli
          # Un reintento: el builder de Railway se cae solo de vez en cuando (ver cabecera).
          # Más de dos intentos no: si falla dos veces seguidas es del código y hay que mirarlo.
          if ! railway up --service conversia-web --ci; then
            echo "::warning title=Primer intento fallido::El deploy falló; reintentando una vez en 30s."
            sleep 30
            railway up --service conversia-web --ci
          fi
      # `railway up` devolvió 0, pero eso no dice que la web nueva esté sirviendo. Lo único que lo
      # dice es leer /version.json desde fuera. Si no aparece este SHA, el job se pone rojo.
      - name: Producción sirve este commit
        run: node tools/ops/verificar-despliegue.mjs https://app.conversia.cl/version.json
