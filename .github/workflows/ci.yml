name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sin `version`: la toma del campo packageManager de package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @conversia/database db:generate
      - run: pnpm build
      # Que el api ARRANQUE, no solo que compile: un error de inyección de Nest mata el
      # proceso al arrancar y ni `tsc` ni vitest lo ven (vitest transpila con esbuild,
      # que no emite `design:paramtypes`). Antes de esto, el síntoma era el contenedor
      # del api sin responder en el job `dueno`, 4 minutos después y sin logs.
      - name: El grafo de dependencias de Nest se resuelve
        run: node tools/ops/check-di.cjs
      # 28-oct-2026: la contraseña y el secreto TOTP del super admin OWNER de la producción
      # compartida estaban escritos en un documento del repo. Gitleaks no los vio (una
      # contraseña en prosa no calza con ningún patrón de proveedor), así que esto los busca.
      - name: Sin credenciales en claro en el repo
        run: node tools/ops/check-plaintext-credentials.cjs
      - run: pnpm typecheck
      - run: pnpm test

  # Smoke de robustez del panel: carga cada pantalla con datos deliberadamente
  # incompletos (tenant vacío + registros con null) y falla si alguna revienta.
  # DEBE usar `next start`: la CSP de prod prohíbe unsafe-eval y `next dev` no
  # hidrata. Ver apps/web/e2e/robustness/README.md.
  e2e-robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @conversia/database db:generate
      - run: pnpm --filter @conversia/web build
      - run: pnpm --filter @conversia/web exec playwright install --with-deps chromium
      - name: Smoke de robustez (datos incompletos)
        run: |
          PORT=3010 pnpm --filter @conversia/web start &
          SERVER_PID=$!
          for i in $(seq 1 40); do curl -sf http://localhost:3010/login >/dev/null 2>&1 && break; sleep 2; done
          set +e
          BASE=http://localhost:3010 pnpm --filter @conversia/web test:e2e
          STATUS=$?
          set -e
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

  # M5 — e2e de la PWA de conversia-web (instalable + SW + offline + sin scroll horizontal),
  # móvil y escritorio, claro y oscuro. Subconjunto SIN backend (corre contra `next start`);
  # los flujos con API (RUN_FLOWS=1) se corren contra el stack Docker local, no en CI.
  e2e-conversia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @conversia/database db:generate
      - run: pnpm --filter @conversia/conversia-web build
      - run: pnpm --filter @conversia/conversia-web exec playwright install --with-deps chromium
      - name: e2e PWA (móvil + escritorio)
        run: |
          PORT=3002 pnpm --filter @conversia/conversia-web start &
          SERVER_PID=$!
          for i in $(seq 1 40); do curl -sf http://localhost:3002/login >/dev/null 2>&1 && break; sleep 2; done
          set +e
          BASE=http://localhost:3002 pnpm --filter @conversia/conversia-web test:e2e:pwa
          STATUS=$?
          set -e
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: conversia-e2e-report
          path: apps/conversia-web/playwright-report
          retention-days: 7

