<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión — TuBot</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f1f5f9; color: #0f172a; padding: 24px;
      }
      @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } }
      .card { max-width: 360px; text-align: center; }
      img { width: 56px; height: 56px; object-fit: contain; margin-bottom: 12px; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p { font-size: 14px; opacity: .8; margin: 0 0 16px; }
      .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef4444; margin-right:6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/brand/tubot-icon.png" alt="TuBot" />
      <h1>Sin conexión</h1>
      <p><span class="dot"></span>No pudimos conectar. Reintentaremos en cuanto vuelva internet.</p>
      <small id="status">Esperando conexión…</small>
    </div>
    <script>
      // Reintento automático: al recuperar la red, recarga. También sondea cada 5 s.
      function retry() { location.reload(); }
      window.addEventListener("online", retry);
      setInterval(function () { if (navigator.onLine) retry(); }, 5000);
    </script>
  </body>
</html>
